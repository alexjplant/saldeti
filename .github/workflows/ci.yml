name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # lint runs: go vet ./...
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # test runs: go test ./internal/... ./cmd/... -v -count=1
      - run: mise run test

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # ui-test runs: go test -tags ui,entra -v -count=1 ./internal/entra/ui_test/...
      - run: mise run ui-test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # e2e runs: go test ./test/... -v -count=1 -tags=e2e,entra,google
      - run: mise run e2e

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # ui-e2e-install runs: npm install && npx playwright install --with-deps chromium
      - run: mise run ui-e2e-install
      # ui-e2e runs Entra Playwright tests: npx playwright test --project=chromium
      - run: mise run ui-e2e
      # ui-e2e-google runs Google Playwright tests: npx playwright test --project=google-chromium
      - run: mise run ui-e2e-google
